# IGXSecure — Nginx Reverse Proxy Config
# Phase 3: local development (HTTP only)
# Phase 7: upgrade to HTTPS with Let's Encrypt

upstream igxsecure_backend {
    server 127.0.0.1:5000;
}

upstream igxsecure_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name localhost;

    # --- API requests → Node.js backend ---
    location /igxsecure/api/ {
        proxy_pass         http://igxsecure_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Security: hide backend version
        proxy_hide_header  X-Powered-By;
    }

    # --- Frontend → React dev server ---
    location /igxsecure/ {
        proxy_pass         http://igxsecure_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # --- Root redirect ---
    location / {
        return 301 /igxsecure/;
    }

    # --- Block direct access attempts ---
    location ~* \.(env|git|log)$ {
        deny all;
        return 404;
    }
}