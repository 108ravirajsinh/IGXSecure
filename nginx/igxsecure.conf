server {
    listen 80;
    server_name localhost;

    # Redirect bare root to app base path
    location = / {
        return 302 /igxsecure/;
    }

    # Backend API
    # No trailing slash in proxy_pass so full path is preserved:
    # /igxsecure/api/system/health -> backend receives same path
    location /igxsecure/api/ {
        proxy_pass http://backend:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend static pages
    # Strip /igxsecure prefix before sending to frontend nginx
    location /igxsecure/ {
        rewrite ^/igxsecure/(.*)$ /$1 break;
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}