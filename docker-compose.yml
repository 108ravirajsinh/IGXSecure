services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: igxsecure-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igxsecure-backend
    environment:
      - PORT=9000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - ALLOWED_ORIGIN=http://localhost
      - TOKEN_SECRET=change_this_to_a_32_char_secret!!
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: igxsecure-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/igxsecure.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped