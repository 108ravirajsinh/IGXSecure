services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minimal-instagram-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minimal-instagram-frontend
    ports:
      - "3000:3000"
    environment:
      # This is what the React app will use at runtime.
      # Do not hardcode in code; override per environment (e.g., cloud host).
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped
