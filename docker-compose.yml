services:
  postgres:
    image: postgres:16-alpine
    container_name: igxsecure-postgres
    environment:
      POSTGRES_DB:       igxsecure
      POSTGRES_USER:     igxuser
      POSTGRES_PASSWORD: changeme_strong_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igxuser -d igxsecure"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: igxsecure-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igxsecure-backend
    environment:
      - PORT=9000
      - HOST=0.0.0.0
      - NODE_ENV=development
      - ALLOWED_ORIGIN=http://localhost
      - TOKEN_SECRET=change_this_to_a_32_char_secret!!
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=igxsecure
      - DB_USER=igxuser
      - DB_PASSWORD=changeme_strong_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: igxsecure-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/igxsecure.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata: